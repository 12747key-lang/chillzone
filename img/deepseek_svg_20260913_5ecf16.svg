<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Segoe UI', Roboto, system-ui, sans-serif">
  <defs>
    <!-- Фон -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1c"/>
      <stop offset="100%" stop-color="#1a1f2f"/>
    </linearGradient>

    <!-- Градиент заголовка -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a0c8ff"/>
      <stop offset="50%" stop-color="#6d8cff"/>
      <stop offset="100%" stop-color="#b48aff"/>
    </linearGradient>

    <!-- Свечение -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Радиальные свечения -->
    <radialGradient id="radialBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f7eff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f7eff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radialPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b48aff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b48aff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Свечения -->
  <circle cx="150" cy="100" r="280" fill="url(#radialBlue)"/>
  <circle cx="680" cy="320" r="300" fill="url(#radialPurple)"/>

  <!-- Тонкая сетка -->
  <g stroke="#4f7eff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Иконка геймпада сверху -->
  <g transform="translate(400, 80)" filter="url(#bigGlow)">
    <circle r="38" fill="#1a2440" stroke="#6d8cff" stroke-width="1.5"/>
    <text y="14" text-anchor="middle" font-size="38">🎮</text>
  </g>

  <!-- Главная надпись CHILL ZONE -->
  <text x="400" y="215" text-anchor="middle" font-size="86" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="4">CHILL ZONE</text>

  <!-- Подзаголовок -->
  <text x="400" y="260" text-anchor="middle" font-size="16" fill="#8a9bb5" letter-spacing="5">ЗОНА ОТДЫХА ГЕЙМЕРА</text>

  <!-- Разделительная линия -->
  <line x1="300" y1="290" x2="500" y2="290" stroke="#5a8cff" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Три мини-иконки снизу -->
  <g transform="translate(280, 335)">
    <text text-anchor="middle" font-size="22">⏲️</text>
    <text y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#9aaec9" letter-spacing="1">ТАЙМЕР</text>
  </g>

  <g transform="translate(400, 335)">
    <text text-anchor="middle" font-size="22">🎡</text>
    <text y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#9aaec9" letter-spacing="1">ВЕЗЕНИЕ</text>
  </g>

  <g transform="translate(520, 335)">
    <text text-anchor="middle" font-size="22">📱</text>
    <text y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#9aaec9" letter-spacing="1">META QUEST</text>
  </g>
</svg>